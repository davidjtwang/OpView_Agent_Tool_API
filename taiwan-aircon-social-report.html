  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;tw-ac-social-report&quot;&gt;

      }
    }
  &lt;/style&gt;

  &lt;div class=&quot;report-meta&quot;&gt;資料期間：2026/07/01–2026/07/30｜OpView social 來源｜主文＋回文｜品牌：Panasonic、日立、大金、三菱電機、LG、東元&lt;/div&gt;

    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;

    &lt;/div&gt;

    &lt;/div&gt;
    &lt;div class=&quot;chart-wrap&quot;&gt;
      &lt;canvas id=&quot;ac-trend-chart&quot; role=&quot;img&quot; aria-label=&quot;六個冷氣品牌在 2026 年 7 月 1 日至 30 日的每日社群聲量趨勢。Panasonic 在 7 月 3 日達到 11 則，為全期最高峰。&quot;&gt;&lt;/canvas&gt;
    &lt;/div&gt;

    &lt;/div&gt;

      &lt;canvas id=&quot;ac-share-chart&quot; role=&quot;img&quot; aria-label=&quot;品牌聲量占比。Panasonic 20 則、東元 8 則、三菱電機 5 則、日立 3 則、大金 2 則、LG 0 則。&quot;&gt;&lt;/canvas&gt;
    &lt;/div&gt;

  &lt;div class=&quot;two-col&quot;&gt;
    &lt;section aria-labelledby=&quot;source-title&quot;&gt;

      &lt;/div&gt;

        &lt;canvas id=&quot;ac-source-chart&quot; role=&quot;img&quot; aria-label=&quot;已取得來源明細的 25 則討論全部來自 Plurk；另有 13 則因 OpView 額度限制未取得來源明細。&quot;&gt;&lt;/canvas&gt;
      &lt;/div&gt;
      &lt;p class=&quot;source-note&quot;&gt;Panasonic、日立、大金的來源明細均為 Plurk；三菱電機與東元共 13 則未取得來源細項。&lt;/p&gt;
    &lt;/section&gt;

    &lt;section aria-labelledby=&quot;sentiment-title&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;h2 id=&quot;sentiment-title&quot;&gt;品牌情緒分布&lt;/h2&gt;

      &lt;/div&gt;
      &lt;div class=&quot;chart-wrap source&quot;&gt;
        &lt;canvas id=&quot;ac-sentiment-chart&quot; role=&quot;img&quot; aria-label=&quot;各品牌正面、中立、負面討論分布。Panasonic 為 1 正面、16 中立、3 負面；東元為 2 正面、3 中立、3 負面。&quot;&gt;&lt;/canvas&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;section aria-labelledby=&quot;cloud-title&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;cloud-title&quot;&gt;檢索詞雲（替代視圖）&lt;/h2&gt;
      &lt;span class=&quot;legend-note&quot;&gt;依品牌聲量調整大小，非貼文詞頻&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cloud&quot; role=&quot;img&quot; aria-label=&quot;由本次品牌與冷氣檢索詞構成的替代詞雲。因 OpView 文字雲查詢額度用罄，此區不代表貼文實際詞頻。&quot;&gt;
      &lt;span class=&quot;w5&quot; data-tooltip=&quot;品牌聲量 20&quot;&gt;Panasonic&lt;/span&gt;
      &lt;span class=&quot;w4&quot; data-tooltip=&quot;品牌聲量 20&quot;&gt;國際牌&lt;/span&gt;
      &lt;span class=&quot;w5&quot; data-tooltip=&quot;所有檢索式共同主題詞&quot;&gt;冷氣&lt;/span&gt;
      &lt;span class=&quot;w4&quot; data-tooltip=&quot;所有檢索式共同主題詞&quot;&gt;空調&lt;/span&gt;
      &lt;span class=&quot;w4&quot; data-tooltip=&quot;品牌聲量 8&quot;&gt;東元&lt;/span&gt;
      &lt;span class=&quot;w3&quot; data-tooltip=&quot;品牌聲量 8&quot;&gt;TECO&lt;/span&gt;
      &lt;span class=&quot;w3&quot; data-tooltip=&quot;品牌聲量 5&quot;&gt;三菱電機&lt;/span&gt;
      &lt;span class=&quot;w2&quot; data-tooltip=&quot;品牌聲量 5&quot;&gt;Mitsubishi Electric&lt;/span&gt;
      &lt;span class=&quot;w2&quot; data-tooltip=&quot;品牌聲量 3&quot;&gt;日立&lt;/span&gt;
      &lt;span class=&quot;w2&quot; data-tooltip=&quot;品牌聲量 3&quot;&gt;HITACHI&lt;/span&gt;
      &lt;span class=&quot;w2&quot; data-tooltip=&quot;品牌聲量 2&quot;&gt;大金&lt;/span&gt;
      &lt;span class=&quot;w1&quot; data-tooltip=&quot;品牌聲量 2&quot;&gt;DAIKIN&lt;/span&gt;
      &lt;span class=&quot;w1&quot; data-tooltip=&quot;本期查無結果&quot;&gt;LG&lt;/span&gt;
      &lt;span class=&quot;w1&quot; data-tooltip=&quot;本期查無結果&quot;&gt;樂金&lt;/span&gt;
      &lt;span class=&quot;w3&quot; data-tooltip=&quot;共同主題詞&quot;&gt;冷氣機&lt;/span&gt;
      &lt;span class=&quot;w2&quot; data-tooltip=&quot;共同主題詞&quot;&gt;空調機&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section aria-labelledby=&quot;summary-title&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;summary-title&quot;&gt;觀察摘要與行銷建議&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;summary-grid&quot;&gt;
      &lt;div class=&quot;summary-item&quot;&gt;
        &lt;h3&gt;Panasonic：高聲量，也要先處理負面峰值&lt;/h3&gt;
        &lt;p&gt;占整體 52.6%，7/2–7/3 合計 18 則；負面 3 則、負面率 15.0%。建議先回查高峰貼文主題，針對安裝、耗電、售後等可能疑慮準備客服回覆模組，再以節能實測與使用情境內容承接搜尋熱度。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;summary-item&quot;&gt;
        &lt;h3&gt;東元：小樣本下的負面比例最高&lt;/h3&gt;
        &lt;p&gt;8 則中有 3 則負面，負面率 37.5%，高峰出現在 7/3 與 7/10。建議把社群監測門檻設為單日 2 則即人工複核，並以維修時程、保固流程與常見故障排查內容降低不確定感。&lt;/p&gt;

      &lt;div class=&quot;summary-item&quot;&gt;
        &lt;h3&gt;三菱電機：情緒乾淨，但規模仍小&lt;/h3&gt;
        &lt;p&gt;5 則中 1 則正面、其餘中立，未見負面。可放大具體可驗證的產品優勢與屋型案例，搭配真實使用者證言，目標是提高聲量而不犧牲目前較佳的情緒結構。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;summary-item&quot;&gt;
        &lt;h3&gt;先補齊來源，再決定跨平台預算&lt;/h3&gt;
        &lt;p&gt;已取得的來源明細僅覆蓋 Plurk，LG 本期亦查無結果；目前不宜直接推論全台社群市占。建議擴充 Facebook、Instagram、Threads、YouTube、Dcard 與 PTT 的資料權限，連續觀測 4–8 週後再依平台 CPA 與負面率分配預算。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

  &lt;details class=&quot;method&quot;&gt;
    &lt;summary&gt;資料口徑與限制&lt;/summary&gt;
    &lt;ul&gt;
      &lt;li&gt;資料來自 OpView Agent Tools；帳號回傳警告顯示來源已依授權範圍調整。&lt;/li&gt;
      &lt;li&gt;「social」查詢實際取得 38 則，樣本量偏小；LG 為 0 並不等同於市場上沒有討論。&lt;/li&gt;
      &lt;li&gt;來源細項僅成功取得 Panasonic、日立與大金共 25 則，均為 Plurk；其餘查詢因月額度上限未完成。&lt;/li&gt;
      &lt;li&gt;貼文熱門詞／正式文字雲同樣因額度上限未取得，故以「檢索詞雲」替代並明確區隔，未用替代詞雲推導消費者議題。&lt;/li&gt;
      &lt;li&gt;情緒為系統自動分類，應搭配人工抽樣複核；小樣本比例僅供預警，不宜直接作品牌績效結論。&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/details&gt;

  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;tw-ac-social-report&#x27;);
      if (!root || typeof Chart === &#x27;undefined&#x27;) return;
      const css = getComputedStyle(root);
      const token = name =&gt; css.getPropertyValue(name).trim();
      const colors = [
        token(&#x27;--viz-series-1&#x27;),
        token(&#x27;--viz-series-2&#x27;),
        token(&#x27;--viz-series-3&#x27;),
        token(&#x27;--viz-series-4&#x27;),
        token(&#x27;--viz-series-5&#x27;),
        token(&#x27;--viz-series-6&#x27;)
      ];
      const foreground = token(&#x27;--foreground&#x27;);
      const muted = token(&#x27;--muted-foreground&#x27;);
      const border = token(&#x27;--border&#x27;);
      const popover = token(&#x27;--popover&#x27;);
      const popoverText = token(&#x27;--popover-foreground&#x27;);
      const dates = Array.from({length: 30}, (_, i) =&gt; `7/${i + 1}`);
      const nonzero = {
        Panasonic: {2: 7, 3: 11, 5: 1, 17: 1},
        &#x27;日立&#x27;: {2: 1, 5: 1, 9: 1},
        &#x27;大金&#x27;: {3: 1, 5: 1},
        &#x27;三菱電機&#x27;: {2: 1, 5: 2, 9: 1, 10: 1},
        LG: {},
        &#x27;東元&#x27;: {3: 4, 10: 2, 17: 1, 19: 1}
      };
      const brands = [&#x27;Panasonic&#x27;, &#x27;日立&#x27;, &#x27;大金&#x27;, &#x27;三菱電機&#x27;, &#x27;LG&#x27;, &#x27;東元&#x27;];
      const totals = [20, 3, 2, 5, 0, 8];
      const commonTooltip = {
        backgroundColor: popover,
        titleColor: popoverText,
        bodyColor: popoverText,
        borderColor: border,
        borderWidth: 1,
        displayColors: true
      };
      const commonScales = {
        x: {
          grid: {color: border, lineWidth: 1},
          ticks: {color: muted, maxRotation: 0, autoSkip: true}
        },
        y: {
          beginAtZero: true,
          grid: {color: border, lineWidth: 1},
          ticks: {color: muted, precision: 0},
          title: {display: true, text: &#x27;討論則數&#x27;, color: muted}
        }
      };

      new Chart(root.querySelector(&#x27;#ac-trend-chart&#x27;), {
        type: &#x27;line&#x27;,
        data: {
          labels: dates,
          datasets: brands.map((brand, i) =&gt; ({
            label: brand,
            data: dates.map((_, idx) =&gt; nonzero[brand][idx + 1] || 0),
            borderColor: colors[i],
            backgroundColor: colors[i],
            borderWidth: brand === &#x27;Panasonic&#x27; ? 2 : 1.5,

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  };
  const handlePointerOpen = (event) =&gt; {

      return;
    }

    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
